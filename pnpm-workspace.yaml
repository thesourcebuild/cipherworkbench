packages:
  - "apps/*"
  - "packages/*"
  - "packages/tools/*"

# pnpm 11+ uses allowBuilds, while pnpm 10 uses onlyBuiltDependencies.
# Both are provided for seamless compatibility.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@16.3.7"
  - "@next/mdx@16.3.7"
  - "@next/swc-darwin-arm64@16.3.7"
  - "@next/swc-darwin-x64@16.3.7"
  - "@next/swc-linux-arm64-gnu@16.3.7"
  - "@next/swc-linux-arm64-musl@16.3.7"
  - "@next/swc-linux-x64-gnu@16.3.7"
  - "@next/swc-linux-x64-musl@16.3.7"
  - "@next/swc-win32-arm64-msvc@16.3.7"
  - "@next/swc-win32-x64-msvc@16.3.7"
  - next@16.3.7

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - "@tailwindcss/oxide"
  - unrs-resolver
